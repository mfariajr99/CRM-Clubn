databases:
  - name: clubn-db
    plan: free
    databaseName: clubn
    user: clubn

services:
  - type: web
    name: clubn-diagnostico
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clubn-db
          property: connectionString
